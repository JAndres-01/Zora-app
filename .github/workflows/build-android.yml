name: Build Android APK

on:
  push:
    branches:
      - feature/online-class-tasks
      - feature/react-native-expo
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar Zora.apk (Ubuntu Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Temurin JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "❌ ERROR EN GRADLE. Ultimas 150 lineas del log:"
            tail -n 150 gradle-build.log
            echo "### Errores en Gradle Build" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Subir log de Gradle (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 7

      - name: Preparar y verificar archivo Zora.apk
        run: |
          echo "Buscando archivo APK generado..."
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "APK encontrado en: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "❌ No se encontro ningun archivo .apk generado"
            find android/app/build -maxdepth 4 -ls || true
            exit 1
          fi
          cp "$APK_PATH" Zora.apk
          ls -lh Zora.apk

      - name: Subir Zora.apk a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zora-APK
          path: Zora.apk
          retention-days: 14
