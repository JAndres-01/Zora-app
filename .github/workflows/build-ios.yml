name: Build iOS (Sideloadly IPA)

on:
  push:
    branches:
      - 'release/**'
      - main
  workflow_dispatch:

jobs:
  build-ios-sideloadly:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🍎 Seleccionar Xcode 16 (16.2 / 16.1)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          else
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          echo "Xcode seleccionado:"
          xcodebuild -version

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm ci

      - name: ⚙️ Generar proyecto nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Instalar CocoaPods
        run: npx pod-install ios

      - name: 🔍 Detectar Workspace de Xcode
        id: detect
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          fi
          echo "Workspace detectado: $WORKSPACE"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT

      - name: 🔨 Compilar iOS App para Dispositivo Físico (Release iphoneos)
        run: |
          WORKSPACE="${{ steps.detect.outputs.workspace }}"
          mkdir -p build-output

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Zora" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            -jobs 4 \
            -skipMacroValidation \
            RCT_NO_LAUNCH_PACKAGER=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log | (which xcbeautify > /dev/null && xcbeautify || cat)

      - name: 📦 Empaquetar IPA para Sideloadly (Payload/Zora.app)
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Encontrado App bundle en: $APP_PATH"
            cp -r "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -y Zora.ipa Payload
            echo "✅ Zora.ipa empaquetado exitosamente para Sideloadly."
          else
            echo "❌ No se encontró Zora.app en Release-iphoneos"
            exit 1
          fi

      - name: 📋 Mostrar errores detallados si falló
        if: failure()
        run: |
          echo "=================== ÚLTIMOS ERRORES DE XCODEBUILD ==================="
          if [ -f "xcodebuild.log" ]; then
            grep -E "(error:|fatal error:|BUILD FAILED|\*\* BUILD FAILED \*\*)" xcodebuild.log -A 5 -B 2 || tail -n 150 xcodebuild.log
          fi

      - name: 📤 Subir Zora.ipa a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Zora-iOS-Sideloadly-IPA
          path: build-output/Zora.ipa
          retention-days: 14
