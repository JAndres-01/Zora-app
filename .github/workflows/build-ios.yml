name: Build iOS (Sideloadly IPA)

on:
  push:
    branches:
      - 'release/**'
      - main
  workflow_dispatch:

jobs:
  build-ios-sideloadly:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🍎 Seleccionar Xcode 16 (16.2 / 16.1)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          else
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          echo "Xcode seleccionado:"
          xcodebuild -version

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm ci

      - name: 🔧 Parchear compatibilidad Swift / SwiftPM (Xcode 16 / Swift 6.0)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            let results = [];
            try {
              if (!fs.existsSync(dir)) return results;
              for (const file of fs.readdirSync(dir)) {
                const full = path.join(dir, file);
                const stat = fs.statSync(full);
                if (stat && stat.isDirectory()) {
                  if (file !== '.git' && file !== '.DerivedData' && file !== '.build') {
                    results = results.concat(walk(full));
                  }
                } else if (file === 'Package.swift') {
                  results.push(full);
                }
              }
            } catch (e) {}
            return results;
          }
          const files = [...walk('node_modules'), ...walk('ios')];
          console.log('Archivos Package.swift encontrados:', files);
          for (const f of files) {
            let content = fs.readFileSync(f, 'utf8');
            let original = content;

            // 1. Normalizar swift-tools-version a 6.0
            content = content.replace(/swift-tools-version:\s*6\.\d+(\.\d+)?/gi, 'swift-tools-version: 6.0');

            // 2. Ajustar swift-syntax a 600.0.1
            content = content.replace(/602\.0\.0(-latest)?/gi, '600.0.1');

            // 3. Eliminar trailing commas antes de ) y ] (incompatibles con Swift 6.0)
            let prev;
            do {
              prev = content;
              content = content.replace(/,(\s*[\)\]])/g, '\$1');
            } while (content !== prev);

            if (content !== original) {
              fs.writeFileSync(f, content, 'utf8');
              console.log('✅ Paquete Swift corregido con éxito:', f);
            }
          }

          // 4. Inyectar fallbacks de macros SWIFT_ en cabeceras C++ si faltaran
          const cxxHeaders = [
            'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h',
            'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/CppError.h',
            'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RetainedSwiftPointer.h'
          ];
          for (const h of cxxHeaders) {
            if (fs.existsSync(h)) {
              let content = fs.readFileSync(h, 'utf8');
              if (!content.includes('#define SWIFT_RETURNS_RETAINED')) {
                content = content.replace(
                  '#include <swift/bridging>',
                  '#include <swift/bridging>\n\n#ifndef SWIFT_RETURNS_RETAINED\n#define SWIFT_RETURNS_RETAINED __attribute__((swift_attr("returns_retained")))\n#endif\n#ifndef SWIFT_SHARED_REFERENCE\n#define SWIFT_SHARED_REFERENCE(retain, release) __attribute__((swift_attr("shared_reference:" #retain ":" #release)))\n#endif\n#ifndef SWIFT_IMMORTAL_REFERENCE\n#define SWIFT_IMMORTAL_REFERENCE __attribute__((swift_attr("import_reference")))\n#endif'
                );
                fs.writeFileSync(h, content, 'utf8');
                console.log('✅ Inyectados fallbacks SWIFT_ en:', h);
              }
            }
          }
          "

      - name: ⚙️ Generar proyecto nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🔧 Re-aplicar parche Swift tras prebuild
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            let results = [];
            try {
              if (!fs.existsSync(dir)) return results;
              for (const file of fs.readdirSync(dir)) {
                const full = path.join(dir, file);
                const stat = fs.statSync(full);
                if (stat && stat.isDirectory()) {
                  if (file !== '.git' && file !== '.DerivedData' && file !== '.build') {
                    results = results.concat(walk(full));
                  }
                } else if (file === 'Package.swift') {
                  results.push(full);
                }
              }
            } catch (e) {}
            return results;
          }
          const files = [...walk('node_modules'), ...walk('ios')];
          for (const f of files) {
            let content = fs.readFileSync(f, 'utf8');
            let original = content;
            content = content.replace(/swift-tools-version:\s*6\.\d+(\.\d+)?/gi, 'swift-tools-version: 6.0');
            content = content.replace(/602\.0\.0(-latest)?/gi, '600.0.1');
            let prev;
            do {
              prev = content;
              content = content.replace(/,(\s*[\)\]])/g, '\$1');
            } while (content !== prev);
            if (content !== original) {
              fs.writeFileSync(f, content, 'utf8');
              console.log('✅ Re-parcheado:', f);
            }
          }
          "

      - name: 📦 Instalar CocoaPods
        run: npx pod-install ios

      - name: 🔍 Detectar Workspace de Xcode
        id: detect
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          fi
          echo "Workspace detectado: $WORKSPACE"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT

      - name: 🔨 Pre-compilar ExpoModulesJSI xcframework
        run: |
          chmod +x ./node_modules/expo-modules-jsi/apple/scripts/*.sh 2>/dev/null || true
          PLATFORM_NAME=iphoneos PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" ./node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true

      - name: 🔨 Compilar iOS App para Dispositivo Físico (Release iphoneos)
        id: compile
        run: |
          WORKSPACE="${{ steps.detect.outputs.workspace }}"
          mkdir -p build-output

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Zora" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            -jobs 4 \
            -skipMacroValidation \
            -scmProvider system \
            RCT_NO_LAUNCH_PACKAGER=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: 📋 Diagnóstico detallado de errores en caso de fallo
        if: failure()
        run: |
          echo "======================================================================"
          echo "🔍 BUSCANDO ERRORES EXPLÍCITOS EN EL LOG DE COMPILACIÓN DE XCODE:"
          echo "======================================================================"
          if [ -f "xcodebuild.log" ]; then
            grep -i -C 3 "error:" xcodebuild.log || true
            echo "----------------------------------------------------------------------"
            echo "📄 ÚLTIMAS 150 LÍNEAS DEL LOG:"
            echo "----------------------------------------------------------------------"
            tail -n 150 xcodebuild.log
          fi

      - name: 📦 Empaquetar IPA para Sideloadly (Payload/Zora.app)
        if: success()
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Encontrado App bundle en: $APP_PATH"
            cp -r "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -y Zora.ipa Payload
            echo "✅ Zora.ipa empaquetado exitosamente para Sideloadly."
          else
            echo "❌ No se encontró Zora.app en Release-iphoneos"
            exit 1
          fi

      - name: 📤 Subir Zora.ipa a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Zora-iOS-Sideloadly-IPA
          path: build-output/Zora.ipa
          retention-days: 14
