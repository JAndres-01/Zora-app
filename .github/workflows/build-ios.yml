name: Build iOS IPA

on:
  push:
    branches:
      - feature/online-class-tasks
      - feature/react-native-expo
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar Zora.ipa (macOS Runner)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild iOS & CocoaPods
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export NODE_BINARY=$(which node)
          node scripts/patch-swift-packages.js
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          node scripts/patch-swift-packages.js
          cd ios
          pod install --repo-update

      - name: Compilar con Xcode (Unsigned para Sideloadly)
        run: |
          cd ios
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export NODE_BINARY=$(which node)
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Resolving dependencies for workspace: $WORKSPACE"
          xcodebuild -resolvePackageDependencies -workspace "$WORKSPACE" -scheme "$SCHEME_NAME" || true
          
          echo "Building with workspace: $WORKSPACE and scheme: $SCHEME_NAME"
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -derivedDataPath build \
            build 2>&1 | tee xcodebuild.log || {
              echo "❌ ERROR EN XCODEBUILD. Ultimas 150 lineas del log:"
              tail -n 150 xcodebuild.log
              echo "❌ Errores detectados:"
              grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 60
              echo "### Errores en xcodebuild" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 80 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "### Ultimas lineas del log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Subir log de Xcode (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          retention-days: 7

      - name: Empaquetar archivo Zora.ipa
        run: |
          echo "Buscando .app generado..."
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "App encontrado en: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ No se encontro ningun archivo .app en ios/build/Build/Products"
            ls -laR ios/build/Build/Products
            exit 1
          fi
          mkdir -p build_output/Payload
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -qr ../Zora.ipa Payload
          cd ..
          ls -la Zora.ipa

      - name: Subir Zora.ipa a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zora-IPA
          path: Zora.ipa
          retention-days: 14
