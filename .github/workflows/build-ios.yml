name: Build iOS (Sideloadly IPA)

on:
  workflow_dispatch:

jobs:
  build-ios-sideloadly:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: |
          if [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.5.app
          elif [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.1.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          else
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          echo "Xcode seleccionado:"
          xcodebuild -version

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Limpiar artefactos previos de iOS
        run: |
          rm -rf ios/Pods ios/Podfile.lock ios/build build-output
          rm -rf ~/Library/Developer/Xcode/DerivedData/*Zora* 2>/dev/null || true
          rm -rf ~/Library/Caches/CocoaPods 2>/dev/null || true

      - name: Parchear compatibilidad Swift / SwiftPM
        run: node scripts/patch-swift-packages.js

      - name: Generar proyecto nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Re-aplicar parche Swift tras prebuild
        run: node scripts/patch-swift-packages.js

      - name: Instalar CocoaPods
        run: npx pod-install ios

      - name: Re-aplicar parche Swift tras pod install
        run: node scripts/patch-swift-packages.js

      - name: Detectar Workspace de Xcode
        id: detect
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          fi
          echo "Workspace detectado: $WORKSPACE"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT

      - name: Pre-compilar ExpoModulesJSI xcframework
        run: |
          chmod +x ./node_modules/expo-modules-jsi/apple/scripts/*.sh 2>/dev/null || true
          PLATFORM_NAME=iphoneos PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" ./node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true

      - name: Compilar iOS App para Dispositivo Fisico (Release iphoneos)
        id: compile
        run: |
          WORKSPACE="${{ steps.detect.outputs.workspace }}"
          mkdir -p build-output

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Zora" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            -jobs 4 \
            -skipMacroValidation \
            -scmProvider system \
            OTHER_SWIFTFLAGS="-enable-experimental-feature NonescapableTypes -enable-experimental-feature IsolatedAny -enable-upcoming-feature NonisolatedNonsendingByDefault -enable-upcoming-feature InferIsolatedConformances" \
            RCT_NO_LAUNCH_PACKAGER=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Diagnostico detallado de errores en caso de fallo
        if: failure()
        run: |
          echo "======================================================================"
          echo "BUSCANDO ERRORES EN EL LOG DE COMPILACION DE XCODE:"
          echo "======================================================================"
          if [ -f "xcodebuild.log" ]; then
            grep -i -C 3 "error:" xcodebuild.log || true
            echo "----------------------------------------------------------------------"
            echo "ULTIMAS 150 LINEAS DEL LOG:"
            echo "----------------------------------------------------------------------"
            tail -n 150 xcodebuild.log
          fi

      - name: Verificación automatizada de integridad de Zora.app y binario nativo
        if: success()
        run: |
          echo "======================================================================"
          echo "VERIFICACION PREVIA AL EMPAQUETADO IPA"
          echo "======================================================================"
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontro Zora.app para validar."
            exit 1
          fi
          echo "Validando bundle en: $APP_PATH"

          # 1. Validar Info.plist
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "[OK] Info.plist presente."
            plutil -p "$APP_PATH/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString" || true
          else
            echo "ERROR: Info.plist no existe en el bundle."
            exit 1
          fi

          # 2. Validar Hermes Bytecode Bundle
          BUNDLE_FILE=$(find "$APP_PATH" -name "main.jsbundle" -o -name "*.hbc" | head -n 1)
          if [ -n "$BUNDLE_FILE" ]; then
            echo "[OK] JavaScript / Hermes bytecode bundle encontrado en: $BUNDLE_FILE ($(ls -lh "$BUNDLE_FILE" | awk '{print $5}'))"
          else
            echo "ADVERTENCIA: No se detecto main.jsbundle en la raiz de Zora.app"
          fi

          # 3. Validar simbolos nativos y parches interceptores en el binario Zora
          BINARY="$APP_PATH/Zora"
          if [ -f "$BINARY" ]; then
            echo "[OK] Binario ejecutable Zora presente ($(ls -lh "$BINARY" | awk '{print $5}'))."
            
            # Verificar arquitectura ARM64
            lipo -info "$BINARY"

            # Verificar que el interceptor nativo de RCTFatal esta presente
            if strings "$BINARY" | grep -q "Zora Native Fatal Interceptor"; then
              echo "[OK] VERIFICADO: El interceptor nativo RCTFatal esta compilado y presente en el binario Zora."
            else
              echo "[INFO] Comprobando simbolos en frameworks integrados..."
              find "$APP_PATH/Frameworks" -type f -exec strings {} + 2>/dev/null | grep "Zora Native Fatal Interceptor" | head -n 1 || true
            fi
          else
            echo "ERROR: El binario Zora no existe en $APP_PATH"
            exit 1
          fi
          echo "======================================================================"
          echo "TODAS LAS VERIFICACIONES DE INTEGRIDAD COMPLETADAS CON EXITO"
          echo "======================================================================"

      - name: Empaquetar IPA para Sideloadly (Payload/Zora.app)
        if: success()
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Encontrado App bundle en: $APP_PATH"
            cp -r "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -y Zora.ipa Payload
            echo "Zora.ipa empaquetado exitosamente para Sideloadly."
          else
            echo "No se encontro Zora.app en Release-iphoneos"
            exit 1
          fi

      - name: Subir Zora.ipa a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Zora-iOS-Sideloadly-IPA
          path: build-output/Zora.ipa
          retention-days: 14