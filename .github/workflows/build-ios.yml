name: Build iOS (Simulator / App)

on:
  push:
    branches:
      - 'release/**'
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Destino de compilación'
        required: true
        default: 'simulator'
        type: choice
        options:
          - 'simulator'
          - 'device-unsigned'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm ci

      - name: 🍎 Seleccionar versión de Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: ⚙️ Generar proyecto nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Instalar CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: 🔨 Compilar para iOS Simulator (Release .app)
        if: ${{ github.event.inputs.target != 'device-unsigned' }}
        run: |
          xcodebuild -workspace ios/Zora.xcworkspace \
            -scheme Zora \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          mkdir -p build-output
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../build-output/Zora-iOS-Simulator.app.zip Zora.app

      - name: 🔨 Compilar para dispositivo (Unsigned Payload)
        if: ${{ github.event.inputs.target == 'device-unsigned' }}
        run: |
          xcodebuild -workspace ios/Zora.xcworkspace \
            -scheme Zora \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          mkdir -p build-output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Zora.app build-output/Payload/
          cd build-output
          zip -r Zora-iOS-Unsigned.ipa Payload

      - name: 📤 Subir artefactos de iOS (.app.zip / .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: zora-ios-build
          path: build-output/*
          if-no-files-found: warn
          retention-days: 14
