name: Build iOS (Simulator / App)

on:
  push:
    branches:
      - 'release/**'
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Destino de compilación'
        required: true
        default: 'simulator'
        type: choice
        options:
          - 'simulator'
          - 'device-unsigned'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm ci

      - name: ⚙️ Generar proyecto nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Instalar CocoaPods con npx pod-install
        run: npx pod-install ios

      - name: 🔍 Detectar Workspace y Scheme de Xcode
        id: detect
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          fi
          echo "Workspace detectado: $WORKSPACE"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT

      - name: 🔨 Compilar para iOS Simulator (Release .app)
        if: ${{ github.event_name == 'push' || github.event.inputs.target != 'device-unsigned' }}
        run: |
          WORKSPACE="${{ steps.detect.outputs.workspace }}"
          mkdir -p build-output

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Zora" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

          APP_PATH=$(find ios/build/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/build-output/Zora-iOS-Simulator.app.zip" "$(basename "$APP_PATH")"
          fi

      - name: 🔨 Compilar para dispositivo (Unsigned Payload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'device-unsigned' }}
        run: |
          WORKSPACE="${{ steps.detect.outputs.workspace }}"
          mkdir -p build-output/Payload

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Zora" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER=""

          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r Zora-iOS-Unsigned.ipa Payload
          fi

      - name: 📤 Subir artefactos de iOS (.app.zip / .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: zora-ios-build
          path: build-output/*
          if-no-files-found: warn
          retention-days: 14
